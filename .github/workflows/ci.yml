name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      # Homebrew's unversioned `hdf5` formula is now 2.2.x, which hdf5-metno-sys
      # does not recognise (it knows 1.8-1.14, 2.0.0 and 2.1.0). Pin the 1.14 keg,
      # which is keg-only, so the prefix has to be passed explicitly.
      - name: Install HDF5 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          # Prefer 1.14; fall back to 1.10, which is always present on the runners.
          if brew install hdf5@1.14; then
            keg=hdf5@1.14
          else
            brew install hdf5@1.10
            keg=hdf5@1.10
          fi
          echo "HDF5_DIR=$(brew --prefix $keg)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
