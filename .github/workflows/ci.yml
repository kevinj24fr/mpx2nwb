name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux exercises the system-library path...
      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config
          echo "CARGO_FEATURES=" >> "$GITHUB_ENV"

      # ...and macOS the vendored one. Homebrew now ships HDF5 2.2.x, which
      # hdf5-metno-sys rejects, and the pinned 1.x formulae have been removed, so
      # building from source is the only route that works there.
      - name: Use vendored HDF5 (macOS)
        if: runner.os == 'macOS'
        run: echo "CARGO_FEATURES=--features static" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets $CARGO_FEATURES -- -D warnings
      - run: cargo test --all $CARGO_FEATURES
