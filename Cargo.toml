[package]
name = "mpx2nwb"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Convert Alpha Omega AlphaLab SnR .mpx electrophysiology recordings to NWB 2.7"
authors = ["Kevin Joseph"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/kevinj24fr/mpx2nwb"
homepage = "https://github.com/kevinj24fr/mpx2nwb"
documentation = "https://docs.rs/mpx2nwb"
keywords = ["neuroscience", "electrophysiology", "nwb", "hdf5", "alphaomega"]
categories = ["science", "command-line-utilities"]
exclude = ["/.github", "/tests/data"]

[features]
# Build HDF5 from source rather than linking a system library. Requires cmake, but
# removes the libhdf5 install step entirely. Currently the only working route on
# macOS, where Homebrew ships 2.2.x and has dropped the 1.x formulae.
static = ["hdf5-metno/static", "hdf5-metno/zlib"]

[dependencies]
hdf5-metno = "0.10"
ndarray = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
